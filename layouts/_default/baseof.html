<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">

<head>
{{ partial "head.html" . }}
{{ with resources.Get "style/main.scss" | css.Sass (dict "transpiler" "dartsass" "targetPath" "main.css" "enableSourceMap" true) | minify | fingerprint -}}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{ end -}}
</head>

<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
</body>
</html>
